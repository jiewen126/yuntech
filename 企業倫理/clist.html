<body>
    <nav id="navbar" class="navbar nav-color">

            <div class="button-style">

                <div class="dropdown">
                    <button class="nav-button">學期選擇</button>
                    <div class="dropdown-content">
                        <a href="clist.html?semester=114-2">114-2 學期</a>
                        <a href="clist.html?semester=114-1">114-1 學期</a>
                    </div>
                </div>
            </div>

            </div>
        </div>
        <div class="hero-fade-bottom"></div>

        <div class="row">
        <h2><span id="row-semester-text">114-1</span> 微電影</h2> 
    
        <div id="movie-list" class="netflix-row"></div>
